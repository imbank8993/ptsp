name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy PTSP to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [1/5] Memulai deployment PTSP..."

            # Direktori target di VPS (default: /www/wwwroot/ptsp untuk aaPanel)
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/www/wwwroot/ptsp' }}"

            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "Direktori $DEPLOY_PATH belum ada. Melakukan git clone..."
              mkdir -p "$(dirname "$DEPLOY_PATH")"
              git clone https://github.com/imbank8993/ptsp.git "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"

            echo "📥 [2/5] Mengambil commit terbaru dari origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # Pastikan file backend/.env ada
            if [ ! -f "backend/.env" ]; then
              echo "⚠️ File backend/.env belum ditemukan! Menyalin dari backend/.env.example..."
              cp backend/.env.example backend/.env
            fi

            echo "🐳 [3/5] Build dan restart container Docker..."
            docker compose down
            docker compose up -d --build

            echo "🧹 [4/5] Membersihkan cache Docker..."
            docker image prune -f

            echo "✅ [5/5] Status container PTSP:"
            docker compose ps
